name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 监听你的 main 分支推送

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # 如果你的打包输出文件夹是 dist，保持不变；如果是 build 请改成 build
          branch: gh-pages # 自动化程序会将打包后的静态文件推送到这个分支
